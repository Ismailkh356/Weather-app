<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather App</title>
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" name="" id="" placeholder="Search Weather">
            <button><img src="./images/search.png" alt="Search"></button> 
        </div">
        <p class="error">Invalid Name..</p>
        <div class="hide">
        <div class="weather">
            <img src="images/rain.png" class="weather-icon" alt="Weather Icon">
            <h1 class="temp">°C</h1>
            <h2 class="city"></h2>
        </div>
        <div class="details">
            <div class="col">
                <img src="images/humidity.png" alt="Humidity Icon">
                <div>
                    <p class="humidity">%</p>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="col">
                <img src="images/wind.png" alt="Wind Icon">
                <div>
                    <p class="wind"> km/h</p>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>
    </div>
</div>
 <script async src="https://chatterease.com/embed/2116d960-d566-4eb1-add0-90f7935e3bf7/widget.js"></script>
</body>
</html>
