<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather App</title>
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" name="" id="" placeholder="Search Weather">
            <button><img src="./images/search.png" alt="Search"></button> 
        </div">
        <p class="error">Invalid Name..</p>
        <div class="hide">
        <div class="weather">
            <img src="images/rain.png" class="weather-icon" alt="Weather Icon">
            <h1 class="temp">°C</h1>
            <h2 class="city"></h2>
        </div>
        <div class="details">
            <div class="col">
                <img src="images/humidity.png" alt="Humidity Icon">
                <div>
                    <p class="humidity">%</p>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="col">
                <img src="images/wind.png" alt="Wind Icon">
                <div>
                    <p class="wind"> km/h</p>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>
    </div>
</div>
    <script src="app.js"></script>
<iframe
  src="https://ratingedge.app//embed/16aa5618-cc94-4206-8e29-b74be87d5940"
  title="Foosy"
  style="position:fixed;bottom:24px;right:24px;width:380px;max-width:calc(100vw - 48px);height:520px;max-height:75vh;border:0;border-radius:16px;box-shadow:0 12px 40px rgba(15,23,42,.18);z-index:99999"
></iframe>
</body>
</html>
